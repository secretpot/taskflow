name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-linux-gnu, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu

      - name: Install Cross-Compilation Tools
        run: |
          brew install musl-cross
          brew install mingw-w64
          brew install x86_64-unknown-linux-gnu

      - name: Configure Cargo Linkers
        run: |
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          linker = "x86_64-linux-gnu-gcc"

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"

          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-musl-gcc"
          EOF

      - name: Run Build Script
        run: bash scripts/build.sh --all

      - name: Package Dist Files
        run: |
          cd dist
          for dir in */; do
            # Remove trailing slash
            platform=${dir%/}
            echo "📦 Archiving $platform..."
            tar -czvf "../$platform.tar.gz" -C "$platform" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
